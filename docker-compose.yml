services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-bma_wordpress}
      MYSQL_USER: ${DB_USER:-bma_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-bma_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  wordpress:
    image: wordpress:6.7-php8.2-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-bma_wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-bma_user}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-bma_secret}
      WORDPRESS_DEBUG: ${WP_DEBUG:-0}
    volumes:
      - ./wp-content:/var/www/html/wp-content
      - ./config/wp-config-extra.php:/var/www/html/wp-config-extra.php
      - uploads_data:/var/www/html/wp-content/uploads

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db_data:
  uploads_data:
